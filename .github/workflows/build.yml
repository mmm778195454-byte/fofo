name: Build MDK4 Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git libncurses5-dev libssl-dev python3 rsync unzip zstd wget file coreutils base-files

      - name: Download & Setup OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/24.10.1/targets/ath79/nand/openwrt-sdk-24.10.1-ath79-nand_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar -I zstd -xf openwrt-sdk-24.10.1-ath79-nand_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          mv "$SDK_DIR" sdk

      - name: Add mdk4 Package Feed & Compile
        run: |
          cd sdk
          # إضافة مستودع الحزم الرسمي لجلب mdk4 مباشرة
          git clone https://github.com/openwrt/packages.git package/openwrt-packages
          ./scripts/feeds update -a
          ./scripts/feeds install mdk4
          
          # تجاوز فحص البيئة والبناء المباشر
          make defconfig
          make package/mdk4/compile V=s FORCE=1 IGNORE_ERRORS=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdk4-openwrt-24.10.1
          path: sdk/bin/
